[project]
name = "helivara"
version = "0.1.0"
description = "Helivara Plant-to-Patient FE Bar build (synthetic data)"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2", "numpy>=1.26", "pyarrow>=15",
  "scikit-learn>=1.4", "pg8000>=1.31", "databricks-sdk>=0.40",
  "fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.29",
]

[dependency-groups]
dev = [
    "pypdf>=6.21.4",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/helivara"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
